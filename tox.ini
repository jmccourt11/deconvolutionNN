[tox]
envlist = py311, lint, type-check
isolated_build = True

[testenv]
deps =
    pytest>=7.4.0
    pytest-cov>=4.1.0
    pytest-mock>=3.11.0
    numpy>=1.24.0
    scipy>=1.10.0
    matplotlib>=3.7.0
    torch>=2.0.0
    streamlit>=1.28.0
    plotly>=5.15.0
commands =
    pytest {posargs:src/deconvolutionNN/tests/} --cov=deconvolutionNN --cov-report=term-missing --cov-report=html

[testenv:lint]
deps =
    black>=23.7.0
    isort>=5.12.0
    ruff>=0.0.284
    flake8>=6.0.0
commands =
    black --check --diff src/
    isort --check-only --diff src/
    ruff check src/
    flake8 src/

[testenv:type-check]
deps =
    mypy>=1.5.0
    types-all
commands =
    mypy src/deconvolutionNN/

[testenv:format]
deps =
    black>=23.7.0
    isort>=5.12.0
    ruff>=0.0.284
commands =
    black src/
    isort src/
    ruff format src/
